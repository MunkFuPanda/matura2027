services:
  cert-generator:
    image: alpine:latest
    container_name: ssl-cert-generator
    volumes:
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./certs:/certs
    working_dir: /certs
    command: >
      sh -c "
        apk add --no-cache openssl bash &&
        /scripts/generate-certificates.sh
      "
    profiles:
      - tools

  webserver:
    image: nginx:alpine
    container_name: ssl-webserver
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - web_network

networks:
  web_network:
    driver: bridge
