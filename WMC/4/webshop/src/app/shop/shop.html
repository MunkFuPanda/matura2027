<div class="container mt-5">
  <h2 class="white">Unsere Produkte</h2>
  <br>
  <br>
  <div class="row">
    @for (product of products; track product.id) {
      <div class="col-lg-4 col-sm-12 mb-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">{{ product.description }}</p>
            <b>€{{ product.price }}</b>
            <br><br>
            <button class="btn btn-primary add-to-cart" (click)="addToCart(product)" [attr.data-id]="product.id">In den
              Warenkorb
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
